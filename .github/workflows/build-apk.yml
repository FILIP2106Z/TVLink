name: Build & Release Android APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Keystores for CI Build
        run: |
          # Generate debug.keystore if not present (excluded by .gitignore)
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Generate release upload keystore for CI release build
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating my-upload-key.jks for CI..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Release,O=Android,C=US"
          fi

          chmod +x gradlew || true

      - name: Build Debug & Release APKs
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Assets & Checksums
        id: assets
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/TVLink-v1.0.0.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-assets/TVLink-v1.0.0-debug.apk \;
          
          cd release-assets
          sha256sum TVLink-v1.0.0.apk TVLink-v1.0.0-debug.apk > checksums.txt
          
          echo "Generated Checksums:"
          cat checksums.txt
          
          # Write checksums to output for release body
          echo "CHECKSUMS<<EOF" >> $GITHUB_OUTPUT
          cat checksums.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          cd ..

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TVLink-v1.0.0-debug
          path: release-assets/TVLink-v1.0.0-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TVLink-v1.0.0-release
          path: release-assets/TVLink-v1.0.0.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          echo "Target Release Tag: $TAG"

          cat << 'EOF' > release-notes.md
          ## TVLink v1.0.0 📺

          A modern, open-source wireless ADB remote control, app sideload installer, and TV settings manager for Android TV and Google TV devices over local Wi-Fi.

          ---

          ### ✨ Highlights & Features
          * **🎮 Virtual TV Remote**: Ergonomic D-pad, Home, Back, Menu, Volume, Power, and phone keyboard text injection.
          * **🖱️ Mouse & Touchpad Mode**: Navigate mobile phone apps on Android TV with directional cursor clicks and swipe scrolling.
          * **🚀 1-Tap APK Sideload**: Install APKs from your phone or directly from GitHub/web URLs with 1-tap presets (SmartTube, CleanYourTV, Nova Player).
          * **🛡️ Debloat & Disable Apps**: Safely freeze or disable pre-installed TV bloatware without root (`pm disable-user --user 0`).
          * **⚡ TV Speed Booster**: Instant 2x speed tweak (0.5x UI animation scales) and background process memory cleaner.
          * **⚙️ Hidden TV Settings**: Change screen resolution, display density (DPI scaler), and enable system-wide ad-blocking via Encrypted Private DNS (AdGuard / Cloudflare).
          * **💻 Wireless ADB Terminal**: Full interactive shell with TV diagnostic shortcuts (`dumpsys`, `pm`, `top`, `ip`).
          * **🔍 Auto-Discovery**: Automatic network detection via mDNS (`_adb._tcp.`) and subnet port sweeps.

          ---

          ### 📲 Obtainium Setup (Automated Updates)
          To get automated background updates on your phone or Android TV:
          1. Open **[Obtainium](https://github.com/ImranR98/Obtainium)**.
          2. Tap **Add App** and enter:
             ```text
             https://github.com/${{ github.repository }}
             ```
          3. Obtainium will automatically detect and install **`TVLink-v1.0.0.apk`** and notify you when new releases are published.

          ---

          ### 📦 SHA-256 Checksums
          ```
          EOF
          cat release-assets/checksums.txt >> release-notes.md
          echo '```' >> release-notes.md

          # Publish via GitHub CLI
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub. Updating assets..."
            gh release upload "$TAG" release-assets/TVLink-v1.0.0.apk release-assets/TVLink-v1.0.0-debug.apk release-assets/checksums.txt --clobber
            gh release edit "$TAG" --title "TVLink $TAG" --notes-file release-notes.md --latest
            echo "Successfully updated GitHub Release $TAG"
          else
            echo "Creating new release $TAG on GitHub..."
            gh release create "$TAG" release-assets/TVLink-v1.0.0.apk release-assets/TVLink-v1.0.0-debug.apk release-assets/checksums.txt \
              --title "TVLink $TAG" \
              --notes-file release-notes.md \
              --latest
            echo "Successfully published GitHub Release $TAG"
          fi
