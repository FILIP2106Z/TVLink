name: Build Android APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Keystores for CI Build
        run: |
          # Generate debug.keystore if not present in repository (excluded by .gitignore)
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Generate release upload keystore for CI release build
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating my-upload-key.jks for CI..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Release,O=Android,C=US"
          fi

          chmod +x gradlew || true

      - name: Build Debug APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AdbCommander-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AdbCommander-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
