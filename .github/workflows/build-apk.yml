name: Build & Release Android APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Keystores for CI Build
        run: |
          # Generate debug.keystore if not present (excluded by .gitignore)
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Generate release upload keystore for CI release build
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating my-upload-key.jks for CI..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Release,O=Android,C=US"
          fi

          chmod +x gradlew || true

      - name: Build Debug & Release APKs
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare Clean Release Asset Filenames
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/AdbCommander-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-assets/AdbCommander-debug.apk \;
          ls -la release-assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AdbCommander-Debug-APK
          path: release-assets/AdbCommander-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AdbCommander-Release-APK
          path: release-assets/AdbCommander-release.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases (For Obtainium & Direct Downloads)
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'AdbCommander Latest Release' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### AdbCommander Latest Release
            - Wireless ADB terminal, TV remote control, APK sideload installer, and system settings manager for Android TV / Google TV.
            - Compatible with **Obtainium** for automatic updates and direct installation.
            
            #### Download:
            - **[AdbCommander-release.apk](https://github.com/${{ github.repository }}/releases/download/latest/AdbCommander-release.apk)** (Recommended)
            - **[AdbCommander-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/AdbCommander-debug.apk)**
          files: |
            release-assets/AdbCommander-release.apk
            release-assets/AdbCommander-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
